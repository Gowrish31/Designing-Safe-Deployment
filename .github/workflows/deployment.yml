name: Deploy Orion API

on:
  push:
    branches:
      - main
      - fix/pipeline
  pull_request:
    branches:
      - main

jobs:

  # -------------------------
  # Stage 1: Source
  # -------------------------
  source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


  # -------------------------
  # Stage 2: Build
  # -------------------------
  build:
    needs: source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .


  # -------------------------
  # Stage 3: Test
  # -------------------------
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # -------------------------
  # Stage 4: Security
  # -------------------------
  security:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high


  # -------------------------
  # Stage 5A: Deploy Staging
  # -------------------------
  deploy-staging:
    needs: security
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy to staging
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Deploying to staging..."
          bash scripts/deploy.sh


  # -------------------------
  # Stage 5B: Deploy Production
  # -------------------------
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy to production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Deploying version $GITHUB_SHA to production..."
          bash scripts/deploy.sh


  # -------------------------
  # Stage 6: Verify
  # -------------------------
  verify:
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Run smoke test
        run: |
          sleep 5
          curl -f http://production.orion.internal/health

      - name: Deployment successful notification
        if: success()
        run: |
          echo "Deployment completed successfully"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Smoke test failed. Triggering rollback..."
          # rollback command goes here